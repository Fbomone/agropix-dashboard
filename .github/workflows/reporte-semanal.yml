name: Reporte semanal Agropix

# Lunes 8:00 ART. Argentina usa UTC-3 todo el año (no mueve los relojes desde
# 2009), así que 8:00 ART = 11:00 UTC de forma estable.
#
# Sale el lunes y reporta la semana anterior completa (lunes a domingo): el mail
# del lunes 21/09 trae del 14/09 al 20/09.
#
# Corre acá y no dentro de la app porque Streamlit Community Cloud duerme la app
# cuando nadie la visita: un scheduler en un thread de la app se muere con ella.
on:
  schedule:
    - cron: "0 11 * * 1"
  # Para probarlo cuando quieras desde la pestaña Actions
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generar sin enviar (deja el PDF como artifact)"
        type: boolean
        default: true
      desde:
        description: "Inicio del período (YYYY-MM-DD, opcional)"
        type: string
      hasta:
        description: "Fin del período (YYYY-MM-DD, opcional)"
        type: string

concurrency:
  group: reporte-semanal
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # kaleido necesita un navegador para exportar los gráficos de Plotly a PNG
      - name: Instalar Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser || \
            sudo apt-get install -y --no-install-recommends chromium

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Escribir credenciales de Google
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "::error::Falta el secret GOOGLE_CREDENTIALS_JSON (contenido de credentials.json)"
            exit 1
          fi
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          python -c "import json; json.load(open('credentials.json')); print('credentials.json válido')"

      - name: Enviar reporte
        env:
          CRM_SHEET_ID: ${{ secrets.CRM_SHEET_ID }}
          VENTAS_SHEET_ID: ${{ secrets.VENTAS_SHEET_ID }}
          CRM_TAB: ${{ secrets.CRM_TAB }}
          VENTAS_TAB: ${{ secrets.VENTAS_TAB }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_REMITENTE: ${{ secrets.EMAIL_REMITENTE }}
          EMAIL_DESTINATARIOS: ${{ secrets.EMAIL_DESTINATARIOS }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.desde }}" ]; then ARGS="$ARGS --desde ${{ inputs.desde }}"; fi
          if [ -n "${{ inputs.hasta }}" ]; then ARGS="$ARGS --hasta ${{ inputs.hasta }}"; fi
          python scripts/enviar_reporte_semanal.py $ARGS

      # El PDF queda descargable desde la corrida, sirva o no el mail
      - name: Guardar el PDF de la corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-semanal
          path: salida/
          if-no-files-found: ignore
          retention-days: 30

      - name: Borrar credenciales
        if: always()
        run: rm -f credentials.json
