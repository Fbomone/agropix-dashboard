name: (interno) Enviar reporte

# Workflow REUTILIZABLE: acá viven los pasos de verdad. No se dispara solo —
# lo llaman envio_desarrollo.yml, envio_test.yml y reporte_semanal.yml.
#
# Está así para que los tres corran exactamente el mismo circuito: leer Sheets,
# armar el PDF, mandar el mail y avisar si falla. Lo único que cambia entre
# ellos es el `modo`, que decide a quién le llega y qué prefijo lleva el asunto.
# Un arreglo acá arregla los tres; con tres copias, uno queda desactualizado.
on:
  workflow_call:
    inputs:
      modo:
        description: "desarrollo (solo Franco) | prueba (Franco y Matías) | semanal (todos)"
        type: string
        required: true
      fecha_corte:
        description: "Viernes de cierre a simular (YYYY-MM-DD)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Generar sin enviar"
        type: boolean
        required: false
        default: false
      tipo_historial:
        description: "Cómo queda registrado el envío: AUTOMATICO | MANUAL | PRUEBA"
        type: string
        required: false
        default: "MANUAL"

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Antes de instalar nada: si falta un secret conviene enterarse en el
      # segundo 10 y no en el minuto 5, con el PDF ya armado
      - name: Verificar secrets
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          CRM_SHEET_ID: ${{ secrets.CRM_SHEET_ID }}
          VENTAS_SHEET_ID: ${{ secrets.VENTAS_SHEET_ID }}
        run: |
          faltan=""
          [ -z "$GOOGLE_CREDENTIALS_JSON" ] && faltan="$faltan GOOGLE_CREDENTIALS_JSON"
          [ -z "$CRM_SHEET_ID" ] && faltan="$faltan CRM_SHEET_ID"
          [ -z "$VENTAS_SHEET_ID" ] && faltan="$faltan VENTAS_SHEET_ID"
          if [ -z "$SMTP_USER$SENDGRID_API_KEY" ]; then
            faltan="$faltan SMTP_USER+SMTP_PASSWORD(o SENDGRID_API_KEY)"
          elif [ -n "$SMTP_USER" ] && [ -z "$SMTP_PASSWORD" ]; then
            faltan="$faltan SMTP_PASSWORD"
          fi
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secrets en Settings → Secrets and variables → Actions:$faltan"
            exit 1
          fi
          echo "Modo: ${{ inputs.modo }} · todos los secrets necesarios están cargados."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # kaleido necesita un navegador para exportar los gráficos de Plotly a PNG
      - name: Instalar Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser || \
            sudo apt-get install -y --no-install-recommends chromium

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Escribir credenciales de Google
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          python -c "import json; json.load(open('credentials.json')); print('credentials.json válido')"

      # El modo fija los destinatarios en el codigo: un secret mal cargado no
      # puede convertir una prueba en un envio a todo el equipo
      - name: Enviar reporte
        env:
          CRM_SHEET_ID: ${{ secrets.CRM_SHEET_ID }}
          VENTAS_SHEET_ID: ${{ secrets.VENTAS_SHEET_ID }}
          CRM_TAB: ${{ secrets.CRM_TAB }}
          VENTAS_TAB: ${{ secrets.VENTAS_TAB }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_REMITENTE: ${{ secrets.EMAIL_REMITENTE }}
          URL_APP: ${{ secrets.URL_APP }}
          REPORTE_AMBOS_VIERNES: ${{ secrets.REPORTE_AMBOS_VIERNES }}
        run: |
          ARGS="--modo ${{ inputs.modo }} --tipo ${{ inputs.tipo_historial }}"
          if [ -n "${{ inputs.fecha_corte }}" ]; then ARGS="$ARGS --fecha-corte ${{ inputs.fecha_corte }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/enviar_reporte_semanal.py $ARGS

      # Solo a Franco, en los tres modos: el equipo no puede hacer nada con un
      # mail de error, y el unico que tiene acceso a los secrets es él
      - name: Avisar a Franco si falló
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_REMITENTE: ${{ secrets.EMAIL_REMITENTE }}
        run: |
          python scripts/enviar_reporte_semanal.py --notificar-error \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      - name: Guardar el PDF de la corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ inputs.modo }}
          path: salida/
          if-no-files-found: ignore
          retention-days: 30

      - name: Borrar credenciales
        if: always()
        run: rm -f credentials.json
