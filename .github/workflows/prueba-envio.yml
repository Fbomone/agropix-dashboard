name: PRUEBA — envío automático (solo Franco)

# Workflow TEMPORAL para verificar que el flujo automático funciona de punta a
# punta: lee los Sheets, arma el PDF y manda el mail, sin que nadie toque nada.
#
# Lunes 00:00 ART = 03:00 UTC. Manda SOLO a francobomone14@gmail.com, así se
# prueba sin molestar al resto. El envío real a los 7 sale a las 8:00 ART desde
# reporte-semanal.yml: son dos workflows distintos y no se pisan.
#
# CUANDO LA PRUEBA SALGA BIEN, BORRAR ESTE ARCHIVO. Si no, todos los lunes a
# medianoche va a llegar un mail de prueba además del de las 8.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generar sin enviar (deja el PDF como artifact)"
        type: boolean
        default: false

concurrency:
  group: prueba-envio
  cancel-in-progress: false

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # kaleido necesita un navegador para exportar los gráficos de Plotly a PNG
      - name: Instalar Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser || \
            sudo apt-get install -y --no-install-recommends chromium

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Se chequea antes de leer Sheets y armar el PDF: si falta un secret,
      # conviene enterarse en el segundo 10 y no en el minuto 5
      - name: Verificar secrets
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          CRM_SHEET_ID: ${{ secrets.CRM_SHEET_ID }}
          VENTAS_SHEET_ID: ${{ secrets.VENTAS_SHEET_ID }}
        run: |
          faltan=""
          [ -z "$SMTP_USER" ] && faltan="$faltan SMTP_USER"
          [ -z "$SMTP_PASSWORD" ] && faltan="$faltan SMTP_PASSWORD"
          [ -z "$GOOGLE_CREDENTIALS_JSON" ] && faltan="$faltan GOOGLE_CREDENTIALS_JSON"
          [ -z "$CRM_SHEET_ID" ] && faltan="$faltan CRM_SHEET_ID"
          [ -z "$VENTAS_SHEET_ID" ] && faltan="$faltan VENTAS_SHEET_ID"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secrets en Settings → Secrets and variables → Actions:$faltan"
            exit 1
          fi
          echo "Todos los secrets necesarios están cargados."

      - name: Escribir credenciales de Google
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          python -c "import json; json.load(open('credentials.json')); print('credentials.json válido')"

      - name: Enviar reporte de prueba
        env:
          CRM_SHEET_ID: ${{ secrets.CRM_SHEET_ID }}
          VENTAS_SHEET_ID: ${{ secrets.VENTAS_SHEET_ID }}
          CRM_TAB: ${{ secrets.CRM_TAB }}
          VENTAS_TAB: ${{ secrets.VENTAS_TAB }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          URL_APP: ${{ secrets.URL_APP }}
        run: |
          ARGS="--destinatarios francobomone14@gmail.com --tipo PRUEBA"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/enviar_reporte_semanal.py $ARGS

      - name: Guardar el PDF de la corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-envio
          path: salida/
          if-no-files-found: ignore
          retention-days: 7

      - name: Borrar credenciales
        if: always()
        run: rm -f credentials.json
