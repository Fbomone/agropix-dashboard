name: 2 · Test — Franco y Matías

# El circulo del medio: manda a Franco Y a Matias, con el asunto prefijado
# [PRUEBA]. Es el paso previo al envio real: si el mail se ve bien para los dos,
# ya se puede mandar a todo el equipo.
#
# Solo manual: no tiene schedule a proposito. Tuvo uno temporal el 22/09 para
# ensayar el disparo automatico; ese ensayo encontro el bug de los inputs
# vacios que esta arreglado mas abajo, y despues se quito.
on:
  workflow_dispatch:
    inputs:
      fecha_corte:
        description: "Viernes de cierre a simular (YYYY-MM-DD). Vacío = el viernes más reciente"
        type: string
      dry_run:
        description: "Generar sin enviar (deja el PDF como artifact)"
        type: boolean
        default: false

concurrency:
  group: envio-test
  cancel-in-progress: false

jobs:
  enviar:
    uses: ./.github/workflows/_enviar_reporte.yml
    secrets: inherit
    with:
      modo: prueba
      # En un evento `schedule` el contexto `inputs` viene vacio: no hubo
      # formulario que completar. `dry_run` llegaria como cadena vacia a un
      # input declarado boolean y el job no arranca ("No jobs were run").
      # El `|| false` lo convierte en un booleano de verdad en los dos casos.
      fecha_corte: ${{ inputs.fecha_corte || '' }}
      dry_run: ${{ inputs.dry_run || false }}
      tipo_historial: PRUEBA
