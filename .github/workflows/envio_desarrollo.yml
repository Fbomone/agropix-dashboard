name: 1 · Desarrollo — solo Franco

# El circulo mas chico: manda UNICAMENTE a francobomone14@gmail.com.
# Es para probar lo que sea —un cambio en el mail, en el PDF, en los numeros—
# sin que le llegue a nadie mas. El asunto va prefijado con [DEV].
#
# Solo manual: no tiene schedule a proposito.
on:
  workflow_dispatch:
    inputs:
      fecha_corte:
        description: "Viernes de cierre a simular (YYYY-MM-DD). Vacío = el viernes más reciente"
        type: string
      dry_run:
        description: "Generar sin enviar (deja el PDF como artifact)"
        type: boolean
        default: false

concurrency:
  group: envio-desarrollo
  cancel-in-progress: false

jobs:
  enviar:
    uses: ./.github/workflows/_enviar_reporte.yml
    secrets: inherit
    with:
      modo: desarrollo
      fecha_corte: ${{ inputs.fecha_corte }}
      dry_run: ${{ inputs.dry_run }}
      tipo_historial: PRUEBA
